<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Nivasa</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<div class="auth-page">


    <!-- REGISTER CARD -->
    <div class="auth-card">


        <!-- HEADER -->
        <div class="auth-header">

            <div class="auth-logo">
                🏠
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Join Nivasa and manage your hostel life smarter.
            </p>

        </div>


        <!-- FLASH MESSAGES -->
        {% include "_flash_messages.html" %}


        <!-- REGISTER FORM -->
        <form
            method="POST"
            action="{{ url_for('auth.register') }}"
            class="auth-form"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <!-- FULL NAME -->
            <div class="auth-form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    id="name"
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- EMAIL -->
            <div class="auth-form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="auth-form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="auth-form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    id="confirm_password"
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- SUBMIT -->
            <button
                type="submit"
                class="auth-submit-btn"
            >
                Create Account
            </button>


        </form>


        <!-- FOOTER -->
        <div class="auth-footer">

            <p>

                Already have an account?

                <a href="{{ url_for('auth.login') }}">
                    Login
                </a>

            </p>

        </div>


    </div>


</div>


</body>

</html>
