<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Nivasa</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<div class="auth-page">


    <!-- LOGIN CARD -->
    <div class="auth-card">


        <!-- HEADER -->
        <div class="auth-header">

            <div class="auth-logo">
                🏠
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to your Nivasa account
            </p>

        </div>


        <!-- FLASH MESSAGES -->
        {% include "_flash_messages.html" %}


        <!-- LOGIN FORM -->
        <form
            method="POST"
            action="{{ url_for('auth.login') }}"
            class="auth-form"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <!-- EMAIL -->
            <div class="auth-form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="auth-form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->
            <button
                type="submit"
                class="auth-submit-btn"
            >
                Login
            </button>


        </form>


        <!-- FOOTER -->
        <div class="auth-footer">

            <p>
                Don't have an account?

                <a href="{{ url_for('auth.register') }}">
                    Create one
                </a>

            </p>

        </div>


    </div>


</div>


</body>

</html>
