<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nivasa | Add Fee</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="dashboard-body">


<div class="dashboard-layout">


    <!-- SIDEBAR -->
    {% include "admin/_sidebar.html" %}


    <!-- MAIN CONTENT -->
    <main class="dashboard-main">


        <!-- TOP BAR -->
        <header class="dashboard-topbar">

            <div>

                <button class="mobile-menu">
                    ☰
                </button>

                <span class="dashboard-title">
                    Fee Management
                </span>

            </div>


            <div class="user-menu">

                <div class="notification">
                    🔔
                </div>

                <div class="user-avatar">
                    {{ current_user.name[0]|upper }}
                </div>

                <span>
                    {{ current_user.name }}
                </span>

            </div>

        </header>


        <!-- CONTENT -->
        <section class="dashboard-content">

            {% include "_flash_messages.html" %}


            <!-- PAGE HEADER -->
            <div class="admin-page-header">

                <div>

                    <h1>
                        Add Fee
                    </h1>

                    <p>
                        Create a new fee record for a student.
                    </p>

                </div>

            </div>


            <!-- FORM -->
            <div class="admin-form-card">


                <form
                    method="POST"
                    action="{{ url_for('admin.create_fee') }}"
                >

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >


                    <div class="admin-form-section">

                        <div class="admin-form-section-title">
                            💳 Fee Details
                        </div>


                        <div class="admin-form-grid">


                            <!-- STUDENT -->
                            <div class="admin-form-group full-width">

                                <label for="student_id">
                                    Student
                                </label>

                                <select
                                    id="student_id"
                                    name="student_id"
                                    required
                                >

                                    <option value="">
                                        Select Student
                                    </option>

                                    {% for student in students %}

                                        <option value="{{ student.id }}">

                                            {{ student.user.name }}
                                            —
                                            {{ student.enrollment_no or "No enrollment" }}

                                        </option>

                                    {% endfor %}

                                </select>

                            </div>


                            <!-- FEE TYPE -->
                            <div class="admin-form-group">

                                <label for="fee_type">
                                    Fee Type
                                </label>

                                <select
                                    id="fee_type"
                                    name="fee_type"
                                    required
                                >

                                    <option value="Hostel Fee">
                                        Hostel Fee
                                    </option>

                                    <option value="Mess Fee">
                                        Mess Fee
                                    </option>

                                    <option value="Maintenance Fee">
                                        Maintenance Fee
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>


                            <!-- AMOUNT -->
                            <div class="admin-form-group">

                                <label for="amount">
                                    Amount (₹)
                                </label>

                                <input
                                    id="amount"
                                    type="number"
                                    name="amount"
                                    min="1"
                                    step="0.01"
                                    placeholder="Enter amount"
                                    required
                                >

                            </div>


                            <!-- DUE DATE -->
                            <div class="admin-form-group">

                                <label for="due_date">
                                    Due Date
                                </label>

                                <input
                                    id="due_date"
                                    type="date"
                                    name="due_date"
                                    required
                                >

                            </div>


                        </div>

                    </div>


                    <!-- ACTIONS -->
                    <div class="admin-form-actions">

                        <a
                            href="{{ url_for('admin.fees') }}"
                            class="admin-cancel-btn"
                        >
                            Cancel
                        </a>


                        <button
                            type="submit"
                            class="admin-submit-btn"
                        >
                            💳 Create Fee
                        </button>

                    </div>


                </form>


            </div>


        </section>

    </main>

</div>


</body>

</html>
