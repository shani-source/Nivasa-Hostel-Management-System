<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Room | Nivasa</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="dashboard-body">


<div class="dashboard-layout">


    <!-- SIDEBAR -->
    {% include "admin/_sidebar.html" %}


    <!-- MAIN CONTENT -->
    <main class="dashboard-main">


        <!-- TOP BAR -->
        <header class="dashboard-topbar">

            <div>

                <button class="mobile-menu">
                    ☰
                </button>

                <span class="dashboard-title">
                    Room Management
                </span>

            </div>


            <div class="user-menu">

                <div class="notification">
                    🔔
                </div>

                <div class="user-avatar">
                    {{ current_user.name[0]|upper }}
                </div>

                <span>
                    {{ current_user.name }}
                </span>

            </div>

        </header>


        <!-- CONTENT -->
        <section class="dashboard-content">

            {% include "_flash_messages.html" %}


            <!-- PAGE HEADER -->
            <div class="admin-page-header">

                <div>

                    <h1>
                        Create Room
                    </h1>

                    <p>
                        Add a new room to your hostel.
                    </p>

                </div>

            </div>


            <!-- FORM CARD -->
            <div class="admin-form-card">


                <form method="POST">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >


                    <!-- ROOM INFORMATION -->
                    <div class="admin-form-section">

                        <div class="admin-form-section-title">
                            🛏️ Room Information
                        </div>


                        <div class="admin-form-grid">


                            <!-- HOSTEL -->
                            <div class="admin-form-group">

                                <label for="hostel_id">
                                    Hostel
                                </label>

                                <select
                                    id="hostel_id"
                                    name="hostel_id"
                                    required
                                >

                                    <option value="">
                                        Select hostel
                                    </option>

                                    {% for hostel in hostels %}

                                        <option value="{{ hostel.id }}">
                                            {{ hostel.name }}
                                        </option>

                                    {% endfor %}

                                </select>

                            </div>


                            <!-- ROOM NUMBER -->
                            <div class="admin-form-group">

                                <label for="room_number">
                                    Room Number
                                </label>

                                <input
                                    id="room_number"
                                    type="text"
                                    name="room_number"
                                    placeholder="e.g. 101"
                                    required
                                >

                            </div>


                            <!-- FLOOR -->
                            <div class="admin-form-group">

                                <label for="floor">
                                    Floor
                                </label>

                                <input
                                    id="floor"
                                    type="number"
                                    name="floor"
                                    placeholder="e.g. 1"
                                    min="0"
                                >

                            </div>


                            <!-- CAPACITY -->
                            <div class="admin-form-group">

                                <label for="capacity">
                                    Capacity
                                </label>

                                <select
                                    id="capacity"
                                    name="capacity"
                                    required
                                >

                                    <option value="1">
                                        1 Bed
                                    </option>

                                    <option value="2">
                                        2 Beds
                                    </option>

                                    <option value="3">
                                        3 Beds
                                    </option>

                                    <option value="4" selected>
                                        4 Beds
                                    </option>

                                    <option value="5">
                                        5 Beds
                                    </option>

                                    <option value="6">
                                        6 Beds
                                    </option>

                                </select>

                            </div>


                        </div>

                    </div>


                    <!-- ACTIONS -->
                    <div class="admin-form-actions">

                        <a
                            href="{{ url_for('admin.rooms') }}"
                            class="admin-cancel-btn"
                        >
                            Cancel
                        </a>


                        <button
                            type="submit"
                            class="admin-submit-btn"
                        >
                            🛏️ Create Room
                        </button>

                    </div>


                </form>


            </div>


        </section>

    </main>

</div>


</body>

</html>
