<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Allocate Room | Nivasa</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="dashboard-body">

<div class="dashboard-layout">

    <!-- SIDEBAR -->
    {% include "admin/_sidebar.html" %}


    <!-- MAIN CONTENT -->
    <main class="dashboard-main">


        <!-- TOP BAR -->
        <header class="dashboard-topbar">

            <div>

                <button class="mobile-menu">
                    ☰
                </button>

                <span class="dashboard-title">
                    Allocate Room
                </span>

            </div>


            <div class="user-menu">

                <div class="notification">
                    🔔
                </div>

                <div class="user-avatar">
                    {{ current_user.name[0]|upper }}
                </div>

                <span>
                    {{ current_user.name }}
                </span>

            </div>

        </header>


        <!-- CONTENT -->
        <section class="dashboard-content">

            {% include "_flash_messages.html" %}


            <!-- PAGE HEADER -->
            <div class="admin-page-header">

                <div>

                    <h1>
                        Allocate Room
                    </h1>

                    <p>
                        Assign a hostel room to a student
                    </p>

                </div>

            </div>


            <!-- FORM CARD -->
            <div class="admin-form-card">

                <form method="POST">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >


                    <div class="admin-form-section">

                        <div class="admin-form-section-title">
                            👥 Student & Room
                        </div>


                        <div class="admin-form-grid">


                            <!-- STUDENT -->
                            <div class="admin-form-group">

                                <label for="student_id">
                                    Student
                                </label>

                                <select
                                    id="student_id"
                                    name="student_id"
                                    required
                                >

                                    <option value="">
                                        Select student
                                    </option>

                                    {% for student in students %}

                                        <option value="{{ student.id }}">

                                            {{ student.user.name }}
                                            —
                                            {{ student.enrollment_no or "No enrollment" }}

                                        </option>

                                    {% endfor %}

                                </select>

                            </div>


                            <!-- ROOM -->
                            <div class="admin-form-group">

                                <label for="room_id">
                                    Room
                                </label>

                                <select
                                    id="room_id"
                                    name="room_id"
                                    required
                                >

                                    <option value="">
                                        Select room
                                    </option>

                                    {% for room in rooms %}

                                        <option
                                            value="{{ room.id }}"
                                            {% if room.occupied >= room.capacity %}
                                                disabled
                                            {% endif %}
                                        >

                                            {{ room.hostel.name }}
                                            — Room {{ room.room_number }}
                                            —
                                            {{ room.available_beds }}
                                            bed(s) available

                                        </option>

                                    {% endfor %}

                                </select>

                            </div>


                        </div>

                    </div>


                    <!-- ACTIONS -->
                    <div class="admin-form-actions">

                        <a
                            href="{{ url_for('admin.dashboard') }}"
                            class="admin-cancel-btn"
                        >
                            Cancel
                        </a>


                        <button
                            type="submit"
                            class="admin-submit-btn"
                        >
                            🛏️ Allocate Room
                        </button>

                    </div>


                </form>

            </div>


        </section>

    </main>

</div>

</body>

</html>
