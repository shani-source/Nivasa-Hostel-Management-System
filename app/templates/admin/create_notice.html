<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nivasa | Create Notice</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="dashboard-body">


<div class="dashboard-layout">


    <!-- SIDEBAR -->
    {% include "admin/_sidebar.html" %}


    <!-- MAIN CONTENT -->
    <main class="dashboard-main">


        <!-- TOP BAR -->
        <header class="dashboard-topbar">

            <div>

                <button class="mobile-menu">
                    ☰
                </button>

                <span class="dashboard-title">
                    Notice Management
                </span>

            </div>


            <div class="user-menu">

                <div class="notification">
                    🔔
                </div>

                <div class="user-avatar">
                    {{ current_user.name[0]|upper }}
                </div>

                <span>
                    {{ current_user.name }}
                </span>

            </div>

        </header>


        <!-- CONTENT -->
        <section class="dashboard-content">

            {% include "_flash_messages.html" %}


            <!-- PAGE HEADER -->
            <div class="admin-page-header">

                <div>

                    <h1>
                        Create Notice
                    </h1>

                    <p>
                        Publish an announcement for hostel residents.
                    </p>

                </div>

            </div>


            <!-- FORM CARD -->
            <div class="admin-form-card">


                <form
                    method="POST"
                    action="{{ url_for('admin.create_notice') }}"
                >

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >


                    <div class="admin-form-section">

                        <div class="admin-form-section-title">
                            📢 Notice Details
                        </div>


                        <div class="admin-form-grid">


                            <!-- TITLE -->
                            <div class="admin-form-group full-width">

                                <label for="title">
                                    Notice Title
                                </label>

                                <input
                                    id="title"
                                    type="text"
                                    name="title"
                                    maxlength="200"
                                    placeholder="e.g. Hostel Maintenance Notice"
                                    required
                                >

                            </div>


                            <!-- CATEGORY -->
                            <div class="admin-form-group">

                                <label for="category">
                                    Category
                                </label>

                                <select
                                    id="category"
                                    name="category"
                                    required
                                >

                                    <option value="General">
                                        General
                                    </option>

                                    <option value="Maintenance">
                                        Maintenance
                                    </option>

                                    <option value="Mess">
                                        Mess
                                    </option>

                                    <option value="Event">
                                        Event
                                    </option>

                                    <option value="Emergency">
                                        Emergency
                                    </option>

                                    <option value="Academic">
                                        Academic
                                    </option>

                                </select>

                            </div>


                            <!-- CONTENT -->
                            <div class="admin-form-group full-width">

                                <label for="content">
                                    Notice Content
                                </label>

                                <textarea
                                    id="content"
                                    name="content"
                                    rows="7"
                                    placeholder="Write your announcement here..."
                                    required
                                ></textarea>

                            </div>


                        </div>

                    </div>


                    <!-- ACTIONS -->
                    <div class="admin-form-actions">

                        <a
                            href="{{ url_for('admin.notices') }}"
                            class="admin-cancel-btn"
                        >
                            Cancel
                        </a>


                        <button
                            type="submit"
                            class="admin-submit-btn"
                        >
                            📢 Publish Notice
                        </button>

                    </div>


                </form>


            </div>


        </section>

    </main>

</div>


</body>

</html>
