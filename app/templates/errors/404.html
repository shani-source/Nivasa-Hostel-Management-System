<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nivasa | Page Not Found</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        .error-page {
            min-height: 100vh;
            margin: 0;
            padding: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-sizing: border-box;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc 0%,
                    #eef7f8 50%,
                    #e6f5f3 100%
                );

            font-family:
                Inter,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }


        .error-card {
            width: 100%;
            max-width: 520px;

            padding: 48px 40px;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 20px;

            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.10);

            text-align: center;

            box-sizing: border-box;
        }


        .error-logo {
            margin-bottom: 28px;

            color: #0f4c5c;

            font-size: 24px;
            font-weight: 700;

            letter-spacing: -0.3px;
        }


        .error-code {
            margin-bottom: 8px;

            color: #0f4c5c;

            font-size: 88px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -4px;
        }


        .error-card h1 {
            margin: 0 0 12px;

            color: #0f172a;

            font-size: 28px;
            font-weight: 700;
        }


        .error-card p {
            margin: 0 auto 30px;

            max-width: 380px;

            color: #64748b;

            font-size: 16px;
            line-height: 1.6;
        }


        .error-back-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 12px 22px;

            background: #0f4c5c;
            color: #ffffff;

            border-radius: 10px;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .error-back-btn:hover {
            background: #0b3944;

            color: #ffffff;

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(15, 76, 92, 0.20);
        }


        @media (max-width: 600px) {

            .error-page {
                padding: 16px;
            }


            .error-card {
                padding: 40px 24px;
            }


            .error-code {
                font-size: 68px;
            }


            .error-card h1 {
                font-size: 24px;
            }


            .error-card p {
                font-size: 15px;
            }
        }
    </style>

</head>


<body class="error-page">

    <div class="error-card">

        <!-- LOGO -->
        <div class="error-logo">
            🏠 Nivasa
        </div>


        <!-- ERROR CODE -->
        <div class="error-code">
            404
        </div>


        <!-- MESSAGE -->
        <h1>
            Page Not Found
        </h1>


        <p>
            The page you're looking for doesn't exist.
        </p>


        <!-- BACK BUTTON -->
        <a
            href="{{
                url_for('student.dashboard')
                if current_user.is_authenticated
                and current_user.role == 'student'
                else url_for('admin.dashboard')
            }}"
            class="error-back-btn"
        >
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
